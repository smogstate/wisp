# Builds Wisp.exe on a real Windows machine, tests it there, and publishes it
# as the "mvp" release, so that running Wisp needs no Python.
name: build

on:
  push:
    branches: [master]
    paths-ignore: ["wiki/**", "checks/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow
          npm ci

      - name: Tests (addon in a Lua VM, the whole loop, the settings)
        run: python tests/test_mvp.py

      - name: Tests (the Anthropic SDK against a stand-in API)
        run: python tests/test_anthropic.py

      - name: Tests (Kimi on the OpenAI SDK against a stand-in API)
        run: python tests/test_openai.py

      - name: The window, from source
        run: python -m wisp --smoke smoke-source.json

      - name: Result
        if: always()
        shell: pwsh
        run: if (Test-Path smoke-source.json) { Get-Content smoke-source.json } else { "no result file" }

      # The exe knows which commit it is, so that it can tell when a newer one is published.
      - name: Stamp the version
        shell: pwsh
        run: |
          @{ commit = $env:GITHUB_SHA; built = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ") } |
            ConvertTo-Json | Set-Content -Encoding utf8 wisp\version.json
          Get-Content wisp\version.json

      - name: Build Wisp.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Wisp
          --exclude-module PIL
          --add-data "wisp/ui.html;wisp" --add-data "wisp/version.json;wisp" --add-data "addon/Wisp;addon/Wisp"
          wisp_app.py

      - name: The window, from the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Wisp.exe -ArgumentList "--smoke", "smoke-exe.json" -Wait -PassThru
          if (Test-Path smoke-exe.json) { Get-Content smoke-exe.json } else { "no result file" }
          if (Test-Path "$env:APPDATA\Wisp\wisp.log") { Get-Content "$env:APPDATA\Wisp\wisp.log" }
          "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      # The update itself, as it happens on a player's PC: a running Wisp.exe renames itself aside,
      # puts the new exe in its place and starts it. Here the "new" exe is a copy of the same build.
      - name: An update, from the exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory upd | Out-Null
          Copy-Item dist\Wisp.exe upd\Wisp.exe
          Copy-Item dist\Wisp.exe upd\Wisp.new.exe
          $p = Start-Process -FilePath upd\Wisp.exe -ArgumentList "--apply-update", "upd\Wisp.new.exe", "--then", "--smoke", "smoke-updated.json" -Wait -PassThru
          "swap exit code: $($p.ExitCode)"
          for ($i = 0; $i -lt 60 -and -not (Test-Path smoke-updated.json); $i++) { Start-Sleep -Seconds 2 }
          Start-Sleep -Seconds 3
          Get-ChildItem upd | Format-Table Name, Length
          if (-not (Test-Path smoke-updated.json)) { "the updated exe did not start"; exit 1 }
          Get-Content smoke-updated.json
          $result = Get-Content smoke-updated.json | ConvertFrom-Json
          if (-not $result.ok) { "the updated exe started but its window test failed"; exit 1 }
          if ($result.version -ne $env:GITHUB_SHA) { "the exe does not know its own commit: $($result.version)"; exit 1 }
          if (-not (Test-Path upd\Wisp.old.exe) -or (Test-Path upd\Wisp.new.exe)) { "the swap did not happen"; exit 1 }

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Wisp
          path: |
            dist/Wisp.exe
            smoke-*.json
            smoke-*.png

      - name: Publish as the "mvp" release
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the addon alone, for installing by hand: unzip into Interface\AddOns
          Compress-Archive -Path addon\Wisp -DestinationPath Wisp-addon.zip -Force
          # what a running Wisp reads to learn there is a newer one, and to check what it then downloads
          @{ commit = $env:GITHUB_SHA; built = (Get-Content wisp\version.json | ConvertFrom-Json).built
             sha256 = (Get-FileHash dist\Wisp.exe -Algorithm SHA256).Hash.ToLower(); size = (Get-Item dist\Wisp.exe).Length } |
            ConvertTo-Json | Set-Content -Encoding utf8 version.json
          Get-Content version.json
          gh release delete mvp --yes --cleanup-tag 2>$null
          Start-Sleep -Seconds 5
          gh release create mvp dist/Wisp.exe Wisp-addon.zip version.json --prerelease --target $env:GITHUB_SHA --title "Wisp MVP" --notes "Wisp.exe, built and tested on Windows by this repository's build workflow from commit $env:GITHUB_SHA. No Python needed. The addon is inside the exe (Settings, Install addon); Wisp-addon.zip is the same addon for installing by hand. See README.md for how to use it. The exe is not signed, so Windows SmartScreen will ask before running it."
