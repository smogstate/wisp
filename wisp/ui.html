<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisp</title>
<link rel="icon" href="data:,">
<style>
  /* --bg-rgb and --panel-rgb are the two surfaces that can be see-through */
  :root {
    --bg-rgb: 246 247 249; --panel-rgb: 255 255 255;
    --bg: #f6f7f9; --panel: #ffffff; --line: #dfe3ea; --text: #1b1f27; --muted: #6a7384;
    --accent: #0e8a7d; --accent-text: #ffffff; --user: #e7f4f2; --danger: #b3261e; --card: #fbfcfd; --chart: #0b8d80;
    --shadow: 0 1px 2px rgba(20, 30, 50, .06);
    --glass: 1;         /* how solid the background is at most, from Settings */
    --glass-now: 1;     /* the background right now */
    --chrome-now: 1;    /* the header and the input bar right now: always a little more solid */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-rgb: 18 21 27; --panel-rgb: 25 29 37;
      --bg: #12151b; --panel: #191d25; --line: #2a303b; --text: #e7eaf0; --muted: #8b95a7;
      --accent: #45d0c0; --accent-text: #06201d; --user: #1d2b2c; --danger: #ff8a80; --card: #1e232c; --chart: #199e70;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg-rgb: 18 21 27; --panel-rgb: 25 29 37;
    --bg: #12151b; --panel: #191d25; --line: #2a303b; --text: #e7eaf0; --muted: #8b95a7;
    --accent: #45d0c0; --accent-text: #06201d; --user: #1d2b2c; --danger: #ff8a80; --card: #1e232c; --chart: #199e70;
    --shadow: none;
  }
  /* keeps the conversation a readable width in a wide browser window */
  :root { --gutter: max(14px, calc((100vw - 760px) / 2)); }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  html, body { height: 100%; margin: 0; }
  html { background: transparent; }
  body {
    background: rgb(var(--bg-rgb) / var(--glass-now)); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; transition: background-color .3s;
  }
  /* Wisp's own see-through window: the background lets the game show, text and cards stay solid.
     It is at its most solid while the mouse is over it or you are typing, and fades otherwise. */
  body.glass { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  body.glass:not(:hover):not(:focus-within) { --glass-now: var(--glass); --chrome-now: min(1, calc(var(--glass) + .15)); }
  /* On Windows the whole window fades instead, and the collapsed window is cut to a disc: fill it. */
  body.fade { border: 1px solid var(--line); }
  body.fade.collapsed #orb button { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
  body.fade.collapsed #orb[data-state="ready"] button::after, body.fade.collapsed #orb[data-state="card"] button::after { top: 9px; right: 9px; }
  header {
    display: flex; align-items: center; gap: 6px; padding: 10px var(--gutter);
    background: rgb(var(--panel-rgb) / var(--chrome-now)); border-bottom: 1px solid var(--line);
    user-select: none; -webkit-user-select: none; transition: background-color .3s;
  }
  header h1 { margin-left: 4px; }
  /* collapsed: nothing but the wisp */
  #orb { display: none; }
  body.collapsed { background: var(--bg); border: 0; }
  body.collapsed.glass { background: transparent; }
  body.collapsed > :not(#orb) { display: none !important; }
  body.collapsed #orb { display: grid; place-items: center; flex: 1; }
  #orb button { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: radial-gradient(circle at 35% 32%, #ffffff 0, var(--accent) 42%, rgb(var(--bg-rgb) / .9) 100%);
    box-shadow: 0 0 12px 2px var(--accent); }
  #orb[data-state="thinking"] button { animation: breathe 1.3s ease-in-out infinite; }
  #orb[data-state="ready"] button::after, #orb[data-state="card"] button::after {
    content: ""; position: absolute; top: -2px; right: -2px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--text); border: 2px solid rgb(var(--bg-rgb)); }
  #orb[data-state="card"] button::after { background: #f5b83d; border-radius: 3px; }
  @keyframes breathe { 0%, 100% { transform: scale(.82); opacity: .75; } 50% { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #orb[data-state="thinking"] button { animation: none; } }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); flex: none; }
  h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: .01em; }
  #status { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; color: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: transparent; padding: 6px 10px; }
  button:hover { border-color: var(--muted); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: .5; cursor: default; }
  button.icon { width: 36px; height: 36px; padding: 0; display: inline-grid; place-items: center; flex: none; }
  button.icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  header button.icon { border-color: transparent; color: var(--muted); }
  header button.icon:hover { color: var(--text); border-color: var(--line); }
  main { flex: 1; overflow-y: auto; padding: 14px var(--gutter); display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.wisp { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }
  .msg.wisp:empty { display: none; }
  .msg.error { align-self: flex-start; color: var(--danger); border: 1px solid var(--danger); background: transparent; }
  .trace { align-self: flex-start; color: var(--muted); font-size: 12px; padding-left: 4px; }
  .note { align-self: center; color: var(--muted); font-size: 12px; }
  .hello { margin: auto; text-align: center; color: var(--muted); max-width: 300px; }
  .hello strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
  .hello .warn { color: var(--danger); margin-top: 10px; }
  .hello .hint { font-size: 12px; }
  .recap { margin-top: 16px; padding: 10px 12px; text-align: left; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .recap h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 650; }
  .recap ul { margin: 0; padding-left: 18px; }
  .card { align-self: stretch; background: var(--card); border: 1px solid var(--accent); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); }
  .card h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 650; }
  .card ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .card li { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; }
  .card .addon { grid-row: span 2; align-self: start; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-top: 2px; }
  .card li.sub { display: flex; justify-content: space-between; gap: 10px; padding-left: 12px; margin-top: -3px; }
  .card .detail { color: var(--muted); font-size: 12px; }
  .card .detail:empty { display: none; }
  .card .plan-title { font-weight: 650; }
  .card .plan-sub, .card .notes { color: var(--muted); font-size: 12px; }
  .card h3 { margin: 12px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
  .card ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: step; }
  .card ol.steps li { display: grid; grid-template-columns: 20px 1fr; column-gap: 8px; counter-increment: step; }
  .card ol.steps li::before { content: counter(step); grid-row: span 3; width: 20px; height: 20px; border-radius: 50%; font-size: 11px;
    font-weight: 650; display: grid; place-items: center; background: var(--line); margin-top: 1px; }
  .card ol.steps li > * { grid-column: 2; }
  .card .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  .card .dot.orange { background: #ff8040; } .card .dot.yellow { background: #e6c200; } .card .dot.green { background: #40bf40; }
  .card .warning { color: var(--danger); font-size: 12px; }
  .card table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .card th { font-weight: 500; font-size: 11px; color: var(--muted); text-align: right; padding: 0 0 4px 8px; }
  .card td { text-align: right; padding: 4px 0 4px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
  .card th:first-child, .card td:first-child { text-align: left; padding-left: 0; white-space: normal; overflow-wrap: anywhere; }
  .card td.none { color: var(--muted); }
  .card td.buy { font-weight: 650; }
  .card .total { margin-top: 8px; font-weight: 650; }
  .card .notes { margin-top: 6px; }
  .card { scroll-margin-top: 8px; }
  .card .stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 0 8px; }
  .card .stats div { display: flex; flex-direction: column; }
  .card .stats span { font-size: 11px; color: var(--muted); }
  .card .stats b { font-weight: 650; }
  .card .chart { position: relative; }
  .card .chart svg { display: block; width: 100%; height: 150px; outline-offset: 2px; }
  .card .chart .grid { stroke: var(--line); stroke-width: 1; }
  .card .chart .usual { stroke: var(--muted); stroke-width: 1; }
  .card .chart .price { fill: none; stroke: var(--chart); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .card .chart .dot { fill: var(--chart); stroke: var(--card); stroke-width: 2; }
  .card .chart .range { fill: var(--chart); opacity: .12; }
  .card .chart .cross { stroke: var(--muted); stroke-width: 1; }
  .card .chart text { font-size: 10px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .card .tip { position: absolute; top: 0; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 8px; font-size: 12px; box-shadow: var(--shadow); white-space: nowrap; }
  .card .tip b { display: block; font-size: 13px; }
  .card .tip span { color: var(--muted); }
  .card details { margin-top: 8px; font-size: 12px; }
  .card summary { color: var(--muted); cursor: pointer; }
  .card details table { margin-top: 6px; }
  .card ul:empty { display: none; }
  .card footer { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .card footer span { flex: 1; color: var(--muted); font-size: 12px; }
  .primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .primary:hover { border-color: var(--accent); filter: brightness(1.06); }
  form { display: flex; gap: 8px; padding: 10px var(--gutter) 14px; background: rgb(var(--panel-rgb) / var(--chrome-now)); border-top: 1px solid var(--line); align-items: flex-end; transition: background-color .3s; }
  textarea {
    flex: 1; resize: none; font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; max-height: 140px; min-height: 38px;
  }
  #send { width: 38px; height: 38px; border-radius: 12px; }
  #meter { padding: 4px var(--gutter) 0; background: rgb(var(--panel-rgb) / var(--chrome-now)); border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; text-align: right; }
  #meter + form { border-top: 0; padding-top: 6px; }
  #palette { list-style: none; margin: 0; padding: 6px var(--gutter); background: var(--panel); border-top: 1px solid var(--line); }
  #palette li { display: flex; gap: 12px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  #palette li[aria-selected="true"] { background: var(--user); }
  #palette b { font-weight: 600; min-width: 84px; }
  #palette span { color: var(--muted); }
  [hidden] { display: none !important; }
  .turn-end { align-self: flex-start; margin-top: -6px; }
  button.ghost { width: 28px; height: 28px; border-color: transparent; color: var(--muted); opacity: .55; }
  button.ghost:hover, button.ghost:focus-visible { opacity: 1; color: var(--text); border-color: var(--line); }
  button.ghost svg { width: 15px; height: 15px; }
  #session-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  #session-list button { width: 100%; text-align: left; border-color: transparent; padding: 8px 10px; display: block; }
  #session-list button:hover, #session-list button:focus-visible { background: var(--bg); border-color: var(--line); }
  #session-list b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #session-list small { color: var(--muted); }
  .peek { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; padding: 10px; max-height: 52vh; overflow-y: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  dialog { width: min(420px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow-y: auto; padding: 16px;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h2 { margin: 0 0 12px; font-size: 16px; }
  dialog label { display: block; font-weight: 600; margin: 12px 0 4px; }
  dialog .row { display: flex; gap: 8px; align-items: center; }
  dialog input { flex: 1; min-width: 0; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  dialog .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  dialog .guess { display: block; width: 100%; text-align: left; margin-top: 4px; font-size: 12px; overflow-wrap: anywhere; }
  dialog .problem { color: var(--danger); margin-top: 10px; }
  dialog .problem:empty { display: none; }
  dialog .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  dialog .actions .grow { flex: 1; }
  #keys { display: flex; flex-direction: column; gap: 6px; }
  #keys .row span { width: 78px; flex: none; color: var(--muted); }
  dialog select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  dialog input[type="range"] { padding: 0; accent-color: var(--accent); }
  dialog .check { display: flex; gap: 8px; align-items: center; font-weight: 400; margin-top: 10px; }
  dialog .check input { flex: none; width: 16px; height: 16px; }
  #results { list-style: none; margin: 12px 0 0; padding: 0; font-size: 13px; }
  #results li { display: grid; grid-template-columns: 44px 1fr; padding: 3px 0; overflow-wrap: anywhere; }
  #results .ok { color: var(--accent); } #results .FAIL { color: var(--danger); font-weight: 600; } #results .note { color: var(--muted); }
  #results small { grid-column: 2; color: var(--muted); }
  #send.stop { background: transparent; color: var(--danger); border-color: var(--danger); }
</style>
</head>
<body>
<div id="orb" class="pywebview-drag-region" data-state="idle">
  <button type="button" aria-label="Open Wisp" title="Open Wisp"></button>
</div>
<header class="pywebview-drag-region">
  <span class="dot" aria-hidden="true"></span>
  <h1>Wisp</h1>
  <span id="status" role="status">starting…</span>
  <button id="history" class="icon" type="button" aria-label="Conversations" title="Conversations"></button>
  <button id="new" class="icon" type="button" aria-label="New conversation" title="New conversation"></button>
  <button id="gear" class="icon" type="button" aria-label="Settings" title="Settings"></button>
  <button id="collapse" class="icon" type="button" aria-label="Collapse" title="Collapse"></button>
  <button id="quit" class="icon" type="button" aria-label="Close Wisp" title="Close Wisp" hidden></button>
</header>
<main id="log" aria-live="polite"></main>
<ul id="palette" role="listbox" aria-label="Commands" hidden></ul>
<div id="meter" hidden></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Ask, or type / for commands" aria-label="Your question"></textarea>
  <button id="send" class="primary icon" type="submit" aria-label="Send" title="Send" data-state="send"></button>
</form>
<dialog id="settings" aria-labelledby="settings-title">
  <div class="row"><h2 id="settings-title" style="flex:1;margin:0">Settings</h2>
    <button id="close" class="icon" type="button" aria-label="Close" title="Close"></button></div>
  <label for="folder">Game folder</label>
  <div class="row">
    <input id="folder" autocomplete="off" spellcheck="false" placeholder="…\World of Warcraft\_forever_" autofocus>
    <button id="browse" class="icon" type="button" aria-label="Browse for the folder" title="Browse for the folder"></button>
  </div>
  <div class="hint">The World of Warcraft folder, or the _forever_ folder inside it.</div>
  <div id="guesses"></div>
  <label>Wisp addon</label>
  <div class="row">
    <span id="addon" style="flex:1"></span>
    <button id="install" type="button">Install addon</button>
  </div>
  <div class="hint" id="addon-hint"></div>
  <label for="provider">Answers come from</label>
  <div class="row">
    <select id="provider" aria-label="Provider"></select>
    <input id="model" list="models" aria-label="Model" spellcheck="false" autocomplete="off" style="flex:1;min-width:0">
    <datalist id="models"></datalist>
  </div>
  <div class="hint" id="model-hint"></div>
  <label>API keys</label>
  <div id="keys"></div>
  <div class="hint">Kept in this PC's credential store. Each key is sent only to its own provider.</div>
  <label for="theme">Appearance</label>
  <div class="row">
    <select id="theme" aria-label="Theme">
      <option value="auto">Follow Windows</option><option value="dark">Dark</option><option value="light">Light</option>
    </select>
    <input id="opacity" type="range" min="30" max="100" step="5" aria-label="How solid the window is">
  </div>
  <div class="hint" id="opacity-hint"></div>
  <label class="check"><input id="plain" type="checkbox"> Use an ordinary window, with a title bar and no transparency</label>
  <div class="hint">Takes effect the next time Wisp starts.</div>
  <div class="problem" id="settings-problem" role="alert"></div>
  <div class="actions">
    <button id="check" type="button">Check setup</button>
    <span class="grow"></span>
    <button id="save" type="button" class="primary">Save</button>
  </div>
  <ul id="results"></ul>
</dialog>
<dialog id="sessions" aria-labelledby="sessions-title">
  <div class="row">
    <button id="back" class="icon" type="button" aria-label="Back to the list" title="Back to the list" hidden></button>
    <h2 id="sessions-title" style="flex:1;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Conversations</h2>
    <button id="sessions-close" class="icon" type="button" aria-label="Close" title="Close"></button>
  </div>
  <div id="session-browse">
    <div class="row" style="margin-top:12px">
      <input id="session-search" type="search" placeholder="Search conversations" aria-label="Search conversations" autocomplete="off" autofocus>
    </div>
    <ul id="session-list"></ul>
    <div class="hint" id="session-empty" hidden></div>
  </div>
  <div id="session-peek" hidden>
    <div id="peek-log" class="peek"></div>
    <div class="actions"><span class="hint grow">Read only. Open it to continue.</span><button id="session-open" type="button" class="primary">Open</button></div>
  </div>
</dialog>
<script>
// Icons from the Feather set (MIT licence), as fixed strings.
const ICONS = {
  send: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  collapse: '<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>',
  branch: '<path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
  back: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
  folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',

// An icon button still has a name: for screen readers, and as the tooltip.

const token = new URLSearchParams(location.search).get("t") || "";
const log = document.getElementById("log"), input = document.getElementById("input");
const send = document.getElementById("send"), statusEl = document.getElementById("status");
let running = false, usage = null, lastCard = null, turnCount = 0, collapsed = false, glass = false, fade = false;
let lastRecap = null, snapshotsKept = 0;

// "Since last time": what changed between your last two logouts, worked out by Wisp itself.
function recapBlock(recap) {
  const box = document.createElement("div");
  box.className = "recap";
  const title = document.createElement("h2");
  title.textContent = "Since last time · " + recap.since + " apart";
  title.title = "What changed between your last two logouts";

const orb = document.getElementById("orb");

// ---- appearance: theme and how see-through the window is ----
function applyLook(theme, opacity) {
  if (theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  document.documentElement.style.setProperty("--glass", glass ? opacity / 100 : 1);
}

// On Windows the window itself fades when not in use: tell Wisp when the mouse or the keyboard is here.
let hovering = false, activeSent = null;
function reportActive() {

  if (!fade || on === activeSent) return;
  activeSent = on;
  post("/api/window", { active: on });
}
document.documentElement.addEventListener("mouseenter", () => { hovering = true; reportActive(); });
document.documentElement.addEventListener("mouseleave", () => { hovering = false; reportActive(); });

window.addEventListener("blur", reportActive);

// ---- collapsing to the wisp and back ----
async function setCollapsed(on) {
  if (on === collapsed) return;
  collapsed = on;
  if (on) {   // hide first, then shrink, so nothing is seen squeezed
    for (const d of document.querySelectorAll("dialog[open]")) d.close();
    orb.dataset.state = running ? "thinking" : "idle";
    document.body.classList.add("collapsed");
    await post("/api/window", { collapsed: true });
  } else {    // grow first, then show
    await post("/api/window", { collapsed: false });
    document.body.classList.remove("collapsed");
    orb.dataset.state = "idle";
    input.focus();
  }
}
function toggleCollapsed() { setCollapsed(!collapsed); }

window.setCollapsed = setCollapsed;

// A click opens the wisp; a drag moves it. Both end with the mouse still over it, so tell them apart by distance.
let pressedAt = null;
orb.onmousedown = (e) => { pressedAt = [e.screenX, e.screenY]; };
orb.onclick = (e) => {
  const moved = pressedAt ? Math.abs(e.screenX - pressedAt[0]) + Math.abs(e.screenY - pressedAt[1]) : 0;
  if (moved < 6) setCollapsed(false);
};

function showMeter() {
  const meter = document.getElementById("meter");
  meter.hidden = !usage || !usage.requests;
  if (meter.hidden) return;
  const tokens = usage.input + usage.output + usage.cache_read + usage.cache_write;
  meter.textContent = tokens.toLocaleString("en-US") + " tokens · " + money(usage) + " this conversation";
}

function money(u) {
  if (!u.priced) return "cost unknown";
  return u.cost < 0.005 ? "under $0.01" : "$" + u.cost.toFixed(2);
}

const api = (path, body) => fetch(path, {
  method: body === undefined ? "GET" : "POST",
  headers: { "X-Wisp-Token": token, "Content-Type": "application/json" },
  body: body === undefined ? undefined : JSON.stringify(body),
});

function add(tag, cls, text, into = log) {
  const el = document.createElement(tag);
  el.className = cls;
  if (text !== undefined) el.textContent = text;   // textContent only: answers and game text are never parsed as HTML
  into.appendChild(el);
  into.scrollTop = into.scrollHeight;
  return el;
}

function age(minutes) {
  if (minutes < 1) return "just now";
  if (minutes < 60) return minutes + " min ago";
  if (minutes < 48 * 60) return Math.round(minutes / 60) + " h ago";
  return Math.round(minutes / 1440) + " days ago";
}

async function refresh() {
  let s;
  try { s = await (await api("/api/state")).json(); } catch { statusEl.textContent = "not connected"; return; }
  statusEl.textContent = s.snapshot_problem ? "no character data"
    : `level ${s.level ?? "?"} · ${s.quests} quests · ${age(s.snapshot_age_minutes ?? 0)}`;
  statusEl.title = (s.snapshot_problem || "Your character as of your last logout") + " · answers from " + s.model;
  lastRecap = s.recap; snapshotsKept = s.snapshots;
  glass = s.window.glass; fade = s.window.fade;
  document.body.classList.toggle("glass", glass);
  document.body.classList.toggle("fade", fade);
  applyLook(s.theme, s.opacity);
  document.getElementById("quit").hidden = !s.window.own;
  document.getElementById("collapse").title = "Collapse" + (s.window.hotkey ? " (" + s.window.hotkey + ")" : " (Esc)");
  if (!running) { usage = s.usage; showMeter(); }
  if (!log.querySelector(".msg, .card")) {
    log.textContent = "";

    const title = document.createElement("strong");
    title.textContent = "Ask about your quests";
    hello.append(title, "Where do I hand this in? What comes next in the chain? Wisp knows your quest log as of your last logout.");
    const who = document.createElement("div");
    who.className = "hint"; who.style.marginTop = "8px"; who.textContent = "Answers from " + s.model;
    hello.append(who);
    if (s.recap) hello.append(recapBlock(s.recap));
    for (const problem of [s.snapshot_problem, s.model_problem, s.questie === false ? "Questie was not found, so locations will be missing." : null]) {
      if (!problem) continue;
      const warn = document.createElement("div");

}

async function copy(text) {
  // first from Wisp's own side, which does not depend on what the web view allows
  try { if ((await (await api("/api/copy", { text })).json()).copied) return true; } catch {}
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const area = document.createElement("textarea");   // older web views: the selection route
  area.value = text;
  document.body.append(area);
  area.select();
  const ok = document.execCommand("copy");
  area.remove();
  return ok;
}

// A crafting plan on a card: the steps in order, a table of materials, the total. Every number is the calculator's.
function planBlock(plan) {
  const make = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const block = make("div", "plan");
  block.append(make("div", "plan-title", plan.title), make("div", "plan-sub", plan.sub));
  block.append(make("h3", "", "Craft, in this order"));
  const steps = make("ol", "steps");
  for (const step of plan.steps) {
    const li = make("li"), head = make("span");
    const dot = make("span", "dot " + (step.colour || ""));
    dot.title = step.colour ? step.colour + " recipe" : "";
    head.append(dot, step.text);
    li.append(head);
    if (step.each) li.append(make("span", "detail", (step.colour ? step.colour + " · " : "") + "each: " + step.each));
    if (step.warning) li.append(make("span", "warning", step.warning));
    steps.append(li);
  }
  block.append(steps);
  if (plan.materials.length) {
    block.append(make("h3", "", "Materials"));
    const table = make("table"), head = make("tr");
    for (const name of ["Item", "Need", "In bags", "Buy", "Cost"]) head.append(make("th", "", name));
    table.append(head);
    for (const row of plan.materials) {
      const tr = make("tr");
      tr.append(make("td", "", row.item), make("td", "", row.need), make("td", row.bags ? "" : "none", row.bags || "–"),
                make("td", row.buy ? "buy" : "none", row.buy || "–"),
                make("td", row.cost ? "" : "none", row.cost || (row.unpriced ? "no price" : "–")));
      table.append(tr);
    }
    block.append(table);
  }
  block.append(make("div", "total", plan.total));
  for (const note of plan.notes || []) block.append(make("div", "notes", note));
  return block;
}

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const svgEl = (tag, attrs, text) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; return e; };
const coins = c => { c = Math.round(c); const g = Math.floor(c / 10000), s = Math.floor(c % 10000 / 100), r = c % 100;
  return [g ? g + "g" : "", s ? s + "s" : "", r && !g ? r + "c" : ""].filter(Boolean).join(" ") || "0c"; };
const dayDate = day => new Date(day * 86400000).toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });

// A ranking as a table: the first column is the name, the rest are figures.
function tableBlock(t) {
  const block = el("div", "plan");
  block.append(el("div", "plan-title", t.title), el("div", "plan-sub", t.sub));
  const table = el("table"), head = el("tr");
  table.style.marginTop = "8px";
  for (const name of t.columns) head.append(el("th", "", name));
  table.append(head);
  for (const row of t.rows) { const tr = el("tr"); for (const cell of row) tr.append(el("td", "", cell)); table.append(tr); }
  block.append(table);
  for (const note of t.notes || []) block.append(el("div", "notes", note));
  return block;
}

// One item's price over time: a line of the day's lowest listing, its usual level, and the
// range estimated for next week. Hover or the arrow keys read any day; the table has them all.
function chartBlock(c) {
  const block = el("div", "plan");
  block.append(el("div", "plan-title", c.title), el("div", "plan-sub", c.sub));
  const stats = el("div", "stats");
  for (const [label, value] of c.stats) { const tile = el("div"); tile.append(el("span", "", label), el("b", "", value)); stats.append(tile); }
  const wrap = el("div", "chart"), tip = el("div", "tip");
  const svg = svgEl("svg", { role: "img", tabindex: "0", "aria-label": `${c.title}: lowest listed price per scan day. ${c.stats.map(s => s.join(" ")).join(", ")}.` });
  tip.hidden = true;
  wrap.append(svg, tip);
  const pts = c.points, est = c.estimate, last = pts[pts.length - 1];
  const day0 = pts[0][0], day1 = last[0] + (est ? 7 : 0);
  const values = pts.map(p => p[1]).concat([c.usual], est ? [est.low, est.high] : []);
  let lo = Math.min(...values), hi = Math.max(...values);
  const pad = Math.max((hi - lo) * 0.12, hi * 0.02, 1);
  lo = Math.max(0, lo - pad); hi += pad;
  const unit = hi >= 20000 ? 10000 : hi >= 200 ? 100 : 1, letter = unit === 10000 ? "g" : unit === 100 ? "s" : "c";
  const rough = (hi - lo) / unit / 3, power = Math.pow(10, Math.floor(Math.log10(rough))), step = [1, 2, 5, 10].find(m => m * power >= rough) * power * unit;
  let active = -1;
  const draw = () => {
    const W = wrap.clientWidth || 340, H = 150, L = 38, R = 10, T = 16, B = 20;
    const x = d => L + (day1 === day0 ? 0.5 : (d - day0) / (day1 - day0)) * (W - L - R), yy = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.textContent = "";
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      svg.append(svgEl("line", { class: "grid", x1: L, x2: W - R, y1: yy(v), y2: yy(v) }),
                 svgEl("text", { x: L - 6, y: yy(v) + 3, "text-anchor": "end" }, +(v / unit).toFixed(2) + letter));
    }
    if (est) {
      svg.append(svgEl("rect", { class: "range", x: x(last[0]), width: x(day1) - x(last[0]), y: yy(est.high), height: Math.max(2, yy(est.low) - yy(est.high)), rx: 2 }),
                 svgEl("text", { x: x(day1), y: Math.max(10, yy(est.high) - 5), "text-anchor": "end" }, "next week"));
    }
    svg.append(svgEl("line", { class: "usual", x1: L, x2: x(last[0]), y1: yy(c.usual), y2: yy(c.usual) }),
               // the label goes on the side of the line the first prices are not on
               svgEl("text", { x: L + 4, y: yy(c.usual) + (pts.slice(0, 5).reduce((sum, p) => sum + p[1], 0) / Math.min(5, pts.length) > c.usual ? 12 : -5) }, "usual"),
               svgEl("path", { class: "price", d: pts.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + yy(p[1]).toFixed(1)).join("") }),
               svgEl("text", { x: L, y: H - 6 }, dayDate(day0)));
    if (pts.length > 1) svg.append(svgEl("text", { x: x(last[0]), y: H - 6, "text-anchor": "end" }, dayDate(last[0])));
    const p = active >= 0 ? pts[active] : last;
    if (active >= 0) svg.append(svgEl("line", { class: "cross", x1: x(p[0]), x2: x(p[0]), y1: T, y2: H - B }));
    svg.append(svgEl("circle", { class: "dot", cx: x(p[0]), cy: yy(p[1]), r: 4 }));
    tip.hidden = active < 0;
    if (active >= 0) {
      tip.textContent = "";
      tip.append(el("b", "", coins(p[1])), el("span", "", dayDate(p[0]) + (p[2] > p[1] ? " · up to " + coins(p[2]) : "") + (p[3] != null ? " · " + p[3] + " listed" : "")));
      tip.style.left = Math.max(0, Math.min(W - tip.offsetWidth, x(p[0]) - tip.offsetWidth / 2)) + "px";
    }
    svg._x = x;
  };
  const aim = clientX => {   // the pointer finds a day, never a 2px line
    const at = clientX - svg.getBoundingClientRect().left;
    let best = 0;
    pts.forEach((p, i) => { if (Math.abs(svg._x(p[0]) - at) < Math.abs(svg._x(pts[best][0]) - at)) best = i; });
    active = best; draw();
  };
  svg.addEventListener("pointermove", e => aim(e.clientX));
  svg.addEventListener("pointerdown", e => aim(e.clientX));
  svg.addEventListener("pointerleave", () => { active = -1; draw(); });
  svg.addEventListener("blur", () => { active = -1; draw(); });
  svg.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    active = Math.max(0, Math.min(pts.length - 1, (active < 0 ? pts.length - 1 : active) + (e.key === "ArrowLeft" ? -1 : 1)));
    draw();
  });
  new ResizeObserver(draw).observe(wrap);
  const details = el("details"), table = el("table"), head = el("tr");
  details.append(el("summary", "", "Every scan day"));
  for (const name of ["Day", "Lowest", "Highest", "Listed"]) head.append(el("th", "", name));
  table.append(head);
  for (const p of pts.slice().reverse()) {
    const tr = el("tr");
    tr.append(el("td", "", dayDate(p[0])), el("td", "", coins(p[1])), el("td", "", coins(p[2])), el("td", p[3] == null ? "none" : "", p[3] == null ? "–" : p[3]));
    table.append(tr);
  }
  details.append(table);
  block.append(stats, wrap, details);
  for (const note of c.notes || []) block.append(el("div", "notes", note));
  return block;
}

function showCard(card, into = log) {
  if (into === log && card.wisp) lastCard = card;
  const el = add("section", "card", undefined, into);
  const h = document.createElement("h2");
  h.textContent = card.plan ? "Crafting plan" : card.chart ? "Price history" : card.table ? "Market" : "For the game";
  const list = document.createElement("ul");
  for (const line of card.lines) {
    const li = document.createElement("li");
    const addon = document.createElement("span"); addon.className = "addon"; addon.textContent = line.addon;
    const text = document.createElement("span"); text.textContent = line.text;
    const detail = document.createElement("span"); detail.className = "detail"; detail.textContent = line.detail;
    if (line.addon) li.append(addon); else li.className = "sub";   // a line without an addon belongs to the one above
    li.append(text, detail);
    list.append(li);
  }
  const foot = document.createElement("footer");
  const hint = document.createElement("span");
  hint.textContent = card.hint || "Copy, then in the game: Ctrl+V twice";
  const button = document.createElement("button");
  button.type = "button"; button.className = "primary icon";
  setIcon(button, "copy", "Copy for the game");
  button.onclick = async () => {
    const ok = await copy(card.wisp);
    button.dataset.state = ok ? "copied" : "failed";
    setIcon(button, ok ? "check" : "x", ok ? "Copied" : "Copy failed");
    hint.textContent = ok ? "Copied. Now in the game: Ctrl+V twice" : "Could not reach the clipboard";
  };
  foot.append(hint, button);
  el.append(h, ...(card.plan ? [planBlock(card.plan)] : []), ...(card.chart ? [chartBlock(card.chart)] : []),
            ...(card.table ? [tableBlock(card.table)] : []), list, ...(card.wisp ? [foot] : []));
  into.scrollTop = into.scrollHeight;
  return el;
}

// ---- a saved conversation, drawn again ----
function renderItem(item, into) {
  if (item.type === "user") add("div", "msg user", item.text, into);
  else if (item.type === "wisp") add("div", "msg wisp", item.text, into);
  else if (item.type === "trace") add("div", "trace", (item.ok ? "looked up: " : "lookup failed: ") + item.name, into);
  else if (item.type === "card") showCard(item.card, into);
  else if (item.type === "error") add("div", "msg error", item.text, into);
  else if (item.type === "note") add("div", "note", item.text, into);
}

function forkButton(turn) {
  const row = add("div", "turn-end");
  const button = document.createElement("button");
  button.type = "button"; button.className = "icon ghost";
  setIcon(button, "branch", "Fork from here: continue in a copy of the conversation up to this point");
  button.onclick = () => fork(turn);
  row.append(button);
  log.scrollTop = log.scrollHeight;
}

function renderSession(view, into = log) {
  into.textContent = "";
  if (into === log) lastCard = null;
  view.turns.forEach((items, turn) => {
    items.forEach(item => renderItem(item, into));
    if (into === log) forkButton(turn);
  });
  if (into === log) { turnCount = view.turns.length; usage = view.usage; showMeter(); }
  into.scrollTop = into.scrollHeight;
}

async function fork(turn) {
  if (running) return;
  const view = await post("/api/fork", turn === undefined ? {} : { turn });
  if (view.error) { add("div", "trace", view.error); return; }
  renderSession(view);
  add("div", "note", "This is a fork. The original is kept under Conversations.");
  refresh();
}

function setRunning(on) {
  running = on;
  send.dataset.state = on ? "stop" : "send";
  setIcon(send, on ? "stop" : "send", on ? "Stop" : "Send");
  send.classList.toggle("stop", on);
  send.classList.toggle("primary", !on);
}

async function ask(text) {
  log.querySelector(".hello")?.remove();
  add("div", "msg user", text);
  let bubble = add("div", "msg wisp"), planEl = null;
  setRunning(true);
  if (collapsed) orb.dataset.state = "thinking";
  try {
    const res = await api("/api/ask", { text });
    if (!res.ok) throw new Error((await res.json()).error || "request failed");
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        const event = JSON.parse(buffer.slice(0, nl));
        buffer = buffer.slice(nl + 1);
        if (collapsed && event.type === "card") orb.dataset.state = "card";
        if (collapsed && event.type === "done" && orb.dataset.state !== "card") orb.dataset.state = "ready";
        if (event.type === "text") { bubble.textContent += event.text; log.scrollTop = log.scrollHeight; }
        else if (event.type === "tool") { add("div", "trace", (event.ok ? "looked up: " : "lookup failed: ") + event.name); bubble = add("div", "msg wisp"); }
        else if (event.type === "card") { const el = showCard(event.card); if (event.card.plan || event.card.chart || event.card.table) planEl = el; bubble = add("div", "msg wisp"); }
        else if (event.type === "usage") { usage = event.usage; showMeter(); }
        else if (event.type === "error") add("div", "msg error", event.message);
        else if (event.type === "done" && event.reason === "stopped") add("div", "note", "stopped");
      }
    }
  } catch (e) {
    add("div", "msg error", "Wisp lost the connection to its own engine: " + e.message);
  }
  setRunning(false);
  try {
    const view = await (await api("/api/session")).json();
    if (view.turns.length > turnCount) { turnCount = view.turns.length; forkButton(turnCount - 1); }
  } catch {}
  if (planEl) planEl.scrollIntoView({ block: "start" });   // a plan is read from its first step, not from its last line
  input.focus();
}

// ---- commands: a "/" at the start tells Wisp what to do instead of asking it something ----
async function newChat() {
  if (running) return;
  await api("/api/new", {});
  renderSession({ turns: [], usage: null });
  refresh();
}

function showCost() {
  log.querySelector(".hello")?.remove();
  if (!usage || !usage.requests) { add("div", "trace", "Nothing spent yet in this conversation."); return; }
  add("div", "trace", `This conversation: ${usage.requests} model requests · ${usage.input.toLocaleString("en-US")} tokens in · ${usage.output.toLocaleString("en-US")} out · ${money(usage)}`);
  add("div", "trace", usage.priced ? "Worked out from the provider's list prices. Your bill from the provider is the final word."
    : "Wisp has no price list for this model, so only tokens are shown.");
}

function showRecap() {
  if (lastRecap) { log.append(recapBlock(lastRecap)); log.scrollTop = log.scrollHeight; return; }
  add("div", "trace", snapshotsKept > 1 ? "Nothing changed between your last two logouts."
    : "Nothing to compare yet. Wisp keeps a snapshot each time you log out; after the next one there will be a recap.");
}

async function copyLast() {
  log.querySelector(".hello")?.remove();
  if (!lastCard) { add("div", "trace", "There are no game instructions to copy yet."); return; }
  add("div", "trace", (await copy(lastCard.wisp)) ? "Copied the last instructions. In the game: Ctrl+V twice." : "Could not reach the clipboard.");
}

async function setTheme(word) {
  const current = (await (await api("/api/state")).json()).theme;
  const order = ["auto", "dark", "light"];
  const theme = order.includes(word) ? word : order[(order.indexOf(current) + 1) % 3];   // no word: the next one
  const s = await post("/api/settings", { theme });
  applyLook(s.theme, s.opacity);
  add("div", "trace", "Theme: " + { auto: "following Windows", dark: "dark", light: "light" }[s.theme] + ".");
}

async function setOpacity(word) {
  const value = parseInt(word, 10);
  if (!glass && !fade) { add("div", "trace", "This window cannot be see-through. Wisp's own window can: see Settings."); return; }
  if (!(value >= 30 && value <= 100)) { add("div", "trace", "Say how solid, from 30 to 100: /opacity 70"); return; }
  const s = await post("/api/settings", { opacity: value });
  applyLook(s.theme, s.opacity);
  add("div", "trace", "The window is now " + s.opacity + "% solid while you are not using it.");
}

const commands = [
  { name: "new", help: "Start a new conversation", run: newChat },
  { name: "sessions", help: "Earlier conversations: search, peek, reopen", run: () => openSessions() },
  { name: "fork", help: "Continue in a copy of this conversation", run: () => fork() },
  { name: "recap", help: "What changed since your last session", run: showRecap },
  { name: "cost", help: "Tokens and cost of this conversation", run: showCost },
  { name: "copy", help: "Copy the last game instructions again", run: copyLast },
  { name: "collapse", help: "Shrink to the wisp; click it to come back", run: () => setCollapsed(true) },
  { name: "theme", help: "dark, light or auto", run: setTheme },
  { name: "opacity", help: "How solid the window is, 30 to 100", run: setOpacity },
  { name: "model", help: "Which provider and model answers", run: async () => { await openSettings(); $("provider").focus(); } },
  { name: "check", help: "Check that everything is set up", run: async () => { await openSettings(); document.getElementById("check").click(); } },
  { name: "settings", help: "Game folder, addon and API key", run: () => openSettings() },
];
const palette = document.getElementById("palette");
let matches = [], selected = 0;

function showPalette() {
  const typed = input.value;
  matches = /^\/\S*$/.test(typed) ? commands.filter(c => c.name.startsWith(typed.slice(1).toLowerCase())) : [];
  selected = Math.min(selected, Math.max(matches.length - 1, 0));
  palette.hidden = matches.length === 0;
  palette.textContent = "";
  matches.forEach((c, i) => {
    const li = document.createElement("li");
    li.setAttribute("role", "option");
    li.setAttribute("aria-selected", i === selected ? "true" : "false");
    const name = document.createElement("b"); name.textContent = "/" + c.name;
    const help = document.createElement("span"); help.textContent = c.help;
    li.append(name, help);
    li.onmousedown = (e) => { e.preventDefault(); runCommand(c); };
    palette.append(li);
  });
}

function runCommand(command, word) {
  input.value = "";
  input.style.height = "";
  showPalette();
  log.querySelector(".hello")?.remove();
  command.run(word);
}

document.getElementById("form").onsubmit = (e) => {
  e.preventDefault();
  if (running) { api("/api/stop", {}); return; }
  const text = input.value.trim();
  if (!text) return;
  if (text.startsWith("/")) {
    const [name, word] = text.slice(1).toLowerCase().split(/\s+/);
    const command = matches[selected] || commands.find(c => c.name === name);
    if (command) { runCommand(command, word); return; }
    input.value = "";
    showPalette();
    add("div", "trace", "There is no command " + text.split(/\s/)[0] + ". Type / to see the commands.");
    return;
  }
  input.value = "";
  input.style.height = "";
  ask(text);
};
input.onkeydown = (e) => {
  if (!palette.hidden && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    selected = (selected + (e.key === "ArrowDown" ? 1 : matches.length - 1)) % matches.length;
    showPalette();
  } else if (!palette.hidden && e.key === "Tab") {
    e.preventDefault();
    input.value = "/" + matches[selected].name;
    showPalette();
  } else if (!palette.hidden && e.key === "Escape") {
    e.stopPropagation();
    input.value = "";
    showPalette();
  } else if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("form").requestSubmit();
  }
};
input.oninput = () => {
  input.style.height = ""; input.style.height = Math.min(input.scrollHeight + 2, 140) + "px";
  selected = 0;
  showPalette();
};
document.onkeydown = (e) => {
  if (e.key !== "Escape" || document.querySelector("dialog[open]")) return;
  if (running) api("/api/stop", {});
  else if (!input.value && !collapsed) setCollapsed(true);   // nothing going on: Esc gets Wisp out of the way
};
document.getElementById("new").onclick = newChat;
// ---- settings ----
const dialog = document.getElementById("settings"), $ = (id) => document.getElementById(id);

function showSettings(s) {
  if (s.error) { $("settings-problem").textContent = s.error; return false; }
  $("settings-problem").textContent = "";
  $("folder").value = s.wow_dir;
  $("browse").hidden = !s.can_browse;
  $("guesses").textContent = "";
  for (const guess of s.guesses.filter(g => g !== s.wow_dir)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "guess"; b.textContent = "Found: " + guess;
    b.onclick = () => { $("folder").value = guess; };
    $("guesses").append(b);
  }
  $("addon").textContent = !s.wow_dir ? "Choose the game folder first"
    : { installed: "Installed", outdated: "An older version is installed", missing: "Not installed" }[s.addon];
  $("install").textContent = s.addon === "outdated" ? "Update addon" : "Install addon";
  $("install").hidden = !s.wow_dir || s.addon === "installed";
  $("addon-hint").textContent = s.addon_note
    || (s.addon === "installed" ? "Wisp keeps this copy up to date by itself." : "Wisp installs its addon into the game's AddOns folder when you save the game folder.");
  $("theme").value = s.theme;
  $("opacity").value = s.opacity;
  $("opacity").disabled = !s.glass;
  $("opacity-hint").textContent = s.glass ? "How solid the window is while you are not using it. It is fully solid under the mouse and while you type."
    : "Transparency needs Wisp's own window.";
  $("plain").checked = s.plain_window;
  // who answers: a provider and one of its models; and a key for each provider
  const provider = $("provider");
  provider.textContent = "";
  $("keys").textContent = "";
  for (const one of s.providers) {
    const option = document.createElement("option");
    option.value = one.id; option.textContent = one.label + (one.key ? "" : " (no key yet)");
    provider.append(option);
    const row = document.createElement("div"); row.className = "row";
    const name = document.createElement("span"); name.textContent = one.company;
    const field = document.createElement("input");
    field.type = "password"; field.autocomplete = "off"; field.spellcheck = false; field.dataset.provider = one.id;
    field.setAttribute("aria-label", one.company + " API key");
    field.placeholder = one.key ? "•••••••• (" + (one.key === "saved" ? "saved on this PC" : one.key) + ")" : one.hint;
    row.append(name, field);
    $("keys").append(row);
  }
  provider.value = s.provider;
  showModels(s.provider);
  return true;
}

// The models of one provider, from its own catalogue once it has a key.
async function showModels(provider) {
  const field = $("model"), choices = $("models");
  field.value = "";   // until this provider's own model is known, none is sent
  let list = { models: [], current: "", has_key: false };
  try { list = await (await api("/api/models?provider=" + encodeURIComponent(provider))).json(); } catch {}
  choices.textContent = "";
  for (const model of list.models || []) {
    const option = document.createElement("option");
    option.value = model;
    choices.append(option);
  }
  field.value = field.placeholder = list.current;
  $("model-hint").textContent = list.has_key ? "Changing the provider starts a new conversation; the earlier one is kept."
    : "Paste a key for this provider below to see all its models.";
}

// A provider can have hundreds of models: the field is typed in, and its list narrows as you type.
// It empties when entered, so the whole list shows, and takes its model back if left empty.
$("model").addEventListener("focus", e => { e.target.value = ""; });
$("model").addEventListener("blur", e => { if (!e.target.value.trim()) e.target.value = e.target.placeholder; });

const keysNow = () => Object.fromEntries([...document.querySelectorAll("#keys input")].filter(f => f.value.trim()).map(f => [f.dataset.provider, f.value]));
const modelNow = () => ({ keys: keysNow(), provider: $("provider").value, model: $("model").value });

async function openSettings() {
  $("results").textContent = "";
  showSettings(await (await api("/api/settings")).json());
  if (!dialog.open) dialog.showModal();
}

async function post(path, body) {
  try { return await (await api(path, body)).json(); } catch { return { error: "Wisp lost the connection to its own engine." }; }
}

$("gear").onclick = openSettings;
$("provider").onchange = () => showModels($("provider").value);
$("close").onclick = () => dialog.close();
const lookNow = () => ({ theme: $("theme").value, opacity: parseInt($("opacity").value, 10), plain_window: $("plain").checked });
$("theme").onchange = $("opacity").oninput = () => applyLook($("theme").value, parseInt($("opacity").value, 10));   // see it before saving
$("save").onclick = async () => {
  const saved = await post("/api/settings", { wow_dir: $("folder").value, ...modelNow(), ...lookNow() });
  if (!showSettings(saved)) return;
  dialog.close();
  if (saved.new_conversation) {   // another provider cannot read this one's history
    renderSession({ turns: [], usage: null });
    add("div", "note", "A new conversation with the other provider. The earlier one is kept under Conversations.");
  }
  refresh();
};
dialog.addEventListener("close", refresh);   // closing without saving puts the look back
$("install").onclick = async () => {
  const saved = await post("/api/settings", { wow_dir: $("folder").value });
  if (showSettings(saved)) showSettings(await post("/api/install-addon", {}));
};
$("browse").onclick = async () => {
  const picked = await post("/api/browse", {});
  if (picked.path) $("folder").value = picked.path;
};
$("check").onclick = async () => {
  const saved = await post("/api/settings", { wow_dir: $("folder").value, ...modelNow() });
  if (!showSettings(saved)) return;
  $("results").textContent = "";
  $("check").disabled = true; $("check").textContent = "Checking…";
  const { results = [], error } = await post("/api/check", {});
  $("check").disabled = false; $("check").textContent = "Check setup";
  if (error) { $("settings-problem").textContent = error; return; }
  for (const r of results) {
    const li = document.createElement("li");
    const mark = document.createElement("span"); mark.className = r.status; mark.textContent = r.status;
    const what = document.createElement("span"); what.textContent = r.what;
    li.append(mark, what);
    if (r.detail) { const d = document.createElement("small"); d.textContent = r.detail; li.append(d); }
    $("results").append(li);
  }
  refresh();
};

// ---- earlier conversations ----
const sessionsDialog = $("sessions");
let peeking = null, searchTimer = null;

function showBrowse() {
  peeking = null;
  $("session-browse").hidden = false; $("session-peek").hidden = true; $("back").hidden = true;
  $("sessions-title").textContent = "Conversations";
}

async function listSessions() {
  let sessions = [];
  try { sessions = (await (await api("/api/sessions?q=" + encodeURIComponent($("session-search").value))).json()).sessions; } catch {}
  const list = $("session-list");
  list.textContent = "";
  for (const one of sessions) {
    const li = document.createElement("li"), button = document.createElement("button");
    button.type = "button";
    const title = document.createElement("b"); title.textContent = one.title;
    const meta = document.createElement("small");
    meta.textContent = `${one.questions} question${one.questions === 1 ? "" : "s"} · ` +
      new Date(one.updated * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) + (one.forked ? " · fork" : "");
    button.append(title, meta);
    button.onclick = () => peek(one);
    li.append(button);
    list.append(li);
  }
  $("session-empty").hidden = sessions.length > 0;
  $("session-empty").textContent = $("session-search").value ? "Nothing matches that." : "No conversations yet. They are kept here once you ask something.";
}

async function peek(one) {
  const view = await post("/api/sessions/peek", { id: one.id });
  if (view.error) return;
  peeking = one.id;
  $("session-browse").hidden = true; $("session-peek").hidden = false; $("back").hidden = false;
  $("sessions-title").textContent = one.title;
  renderSession(view, $("peek-log"));
  $("peek-log").scrollTop = 0;
}

async function openSessions() {
  showBrowse();
  $("session-search").value = "";
  await listSessions();
  if (!sessionsDialog.open) sessionsDialog.showModal();
}

$("history").onclick = openSessions;
$("back").onclick = showBrowse;
$("sessions-close").onclick = () => sessionsDialog.close();
$("session-search").oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(listSessions, 200); };
$("session-open").onclick = async () => {
  if (running || !peeking) return;
  const view = await post("/api/sessions/open", { id: peeking });
  if (view.error) return;
  sessionsDialog.close();
  renderSession(view);
  refresh();
};

$("collapse").onclick = () => setCollapsed(true);
$("quit").onclick = () => post("/api/window", { close: true });

setIcon(send, "send");
setIcon($("collapse"), "collapse");
setIcon($("quit"), "x");
setIcon($("history"), "clock");
setIcon($("back"), "back");
setIcon($("sessions-close"), "x");
setIcon($("new"), "plus");
setIcon($("gear"), "gear");
setIcon($("browse"), "folder");
setIcon($("close"), "x");

refresh().then(async () => {
  try {
    const view = await (await api("/api/session")).json();
    if (view.turns.length) renderSession(view);
  } catch {}
  const s = await (await api("/api/state")).json();
  if (s.needs_setup) openSettings();   // first run: nothing is configured yet
});
setInterval(refresh, 30000);
input.focus();
</script>
</body>
</html>
